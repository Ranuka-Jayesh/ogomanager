<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/2OGOlogo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E16428" />
    <title>Manager Pro </title>
    <script>
      // Detect if device is desktop/laptop and change theme color
      (function() {
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const isTablet = /iPad|Android/i.test(navigator.userAgent) && window.innerWidth >= 768;
        const isDesktop = !isMobile && !isTablet && (window.innerWidth >= 1024 || window.matchMedia('(pointer: fine)').matches);
        
        if (isDesktop) {
          // For desktop/laptop, use dark gray theme color
          const metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute('content', '#363333');
          }
        }
        // For mobile, keep the orange color from manifest.json (#E16428)
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
