<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Monthly revenue trend">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#272121"/>
      <stop offset="100%" stop-color="#1a1818"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f07a42"/>
      <stop offset="100%" stop-color="#E16428"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E16428" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E16428" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="720" height="360" rx="24" fill="url(#bg2)"/>
  <text x="36" y="48" fill="#F6E9E9" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Revenue Pulse</text>
  <text x="36" y="72" fill="#F6E9E9" fill-opacity="0.45" font-family="Segoe UI, Arial, sans-serif" font-size="12">Sample monthly trend · LKR (illustrative)</text>

  <!-- Grid -->
  <g stroke="#F6E9E9" stroke-opacity="0.08">
    <line x1="60" y1="110" x2="680" y2="110"/>
    <line x1="60" y1="160" x2="680" y2="160"/>
    <line x1="60" y1="210" x2="680" y2="210"/>
    <line x1="60" y1="260" x2="680" y2="260"/>
    <line x1="60" y1="300" x2="680" y2="300"/>
  </g>

  <!-- Bars -->
  <g>
    <rect x="90" y="220" width="42" height="80" rx="8" fill="url(#bar)" opacity="0.55"/>
    <rect x="170" y="190" width="42" height="110" rx="8" fill="url(#bar)" opacity="0.65"/>
    <rect x="250" y="165" width="42" height="135" rx="8" fill="url(#bar)" opacity="0.75"/>
    <rect x="330" y="200" width="42" height="100" rx="8" fill="url(#bar)" opacity="0.6"/>
    <rect x="410" y="140" width="42" height="160" rx="8" fill="url(#bar)" opacity="0.85"/>
    <rect x="490" y="120" width="42" height="180" rx="8" fill="url(#bar)"/>
    <rect x="570" y="150" width="42" height="150" rx="8" fill="url(#bar)" opacity="0.9"/>
  </g>

  <!-- Trend line + area -->
  <path d="M111,230 L191,205 L271,180 L351,215 L431,155 L511,135 L591,165 L591,300 L111,300 Z" fill="url(#area)"/>
  <path d="M111,230 L191,205 L271,180 L351,215 L431,155 L511,135 L591,165" fill="none" stroke="#F6E9E9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#F6E9E9">
    <circle cx="111" cy="230" r="4"/><circle cx="191" cy="205" r="4"/><circle cx="271" cy="180" r="4"/>
    <circle cx="351" cy="215" r="4"/><circle cx="431" cy="155" r="4"/><circle cx="511" cy="135" r="4"/>
    <circle cx="591" cy="165" r="4"/>
  </g>

  <g fill="#F6E9E9" fill-opacity="0.55" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">
    <text x="111" y="322">Jan</text><text x="191" y="322">Feb</text><text x="271" y="322">Mar</text>
    <text x="351" y="322">Apr</text><text x="411" y="322">May</text><text x="511" y="322">Jun</text>
    <text x="591" y="322">Jul</text>
  </g>

  <g transform="translate(520,40)">
    <rect width="160" height="44" rx="12" fill="#E16428" fill-opacity="0.15" stroke="#E16428" stroke-opacity="0.4"/>
    <text x="16" y="18" fill="#F6E9E9" fill-opacity="0.55" font-family="Segoe UI, Arial, sans-serif" font-size="10">PEAK MONTH</text>
    <text x="16" y="34" fill="#E16428" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Jun · strongest</text>
  </g>
</svg>
