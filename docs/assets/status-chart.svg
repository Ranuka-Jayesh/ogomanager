<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Project status distribution">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1818"/>
      <stop offset="100%" stop-color="#272121"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="720" height="360" rx="24" fill="url(#bg)"/>
  <text x="36" y="48" fill="#F6E9E9" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Project Status Mix</text>
  <text x="36" y="72" fill="#F6E9E9" fill-opacity="0.45" font-family="Segoe UI, Arial, sans-serif" font-size="12">Illustrative distribution · Manager Pro analytics</text>

  <!-- Donut segments (approx) -->
  <g transform="translate(210,205)" filter="url(#soft)">
    <circle r="95" fill="#232021"/>
    <!-- Running 28% -->
    <path d="M0,-95 A95,95 0 0,1 84.3,-43.9 L0,0 Z" fill="#60A5FA"/>
    <!-- Delivered 34% -->
    <path d="M84.3,-43.9 A95,95 0 0,1 34.6,88.5 L0,0 Z" fill="#34D399"/>
    <!-- Pending 14% -->
    <path d="M34.6,88.5 A95,95 0 0,1 -55.8,76.9 L0,0 Z" fill="#FACC15"/>
    <!-- Pending Payment 12% -->
    <path d="M-55.8,76.9 A95,95 0 0,1 -90.4,-29.4 L0,0 Z" fill="#A78BFA"/>
    <!-- Correction 7% -->
    <path d="M-90.4,-29.4 A95,95 0 0,1 -41.6,-85.5 L0,0 Z" fill="#FB923C"/>
    <!-- Rejected 5% -->
    <path d="M-41.6,-85.5 A95,95 0 0,1 0,-95 L0,0 Z" fill="#F87171"/>
    <circle r="52" fill="#1a1818"/>
    <text text-anchor="middle" y="-4" fill="#E16428" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">100%</text>
    <text text-anchor="middle" y="18" fill="#F6E9E9" fill-opacity="0.5" font-family="Segoe UI, Arial, sans-serif" font-size="11">tracked</text>
  </g>

  <!-- Legend -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#F6E9E9">
    <g transform="translate(420,120)">
      <rect width="14" height="14" rx="3" fill="#60A5FA"/><text x="24" y="12">Running · 28%</text>
    </g>
    <g transform="translate(420,150)">
      <rect width="14" height="14" rx="3" fill="#34D399"/><text x="24" y="12">Delivered · 34%</text>
    </g>
    <g transform="translate(420,180)">
      <rect width="14" height="14" rx="3" fill="#FACC15"/><text x="24" y="12">Pending · 14%</text>
    </g>
    <g transform="translate(420,210)">
      <rect width="14" height="14" rx="3" fill="#A78BFA"/><text x="24" y="12">Pending Payment · 12%</text>
    </g>
    <g transform="translate(420,240)">
      <rect width="14" height="14" rx="3" fill="#FB923C"/><text x="24" y="12">Correction · 7%</text>
    </g>
    <g transform="translate(420,270)">
      <rect width="14" height="14" rx="3" fill="#F87171"/><text x="24" y="12">Rejected · 5%</text>
    </g>
  </g>
  <text x="36" y="340" fill="#E16428" fill-opacity="0.8" font-family="Segoe UI, Arial, sans-serif" font-size="11">OGO · Manager Pro</text>
</svg>
