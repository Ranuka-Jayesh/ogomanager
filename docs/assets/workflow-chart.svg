<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-label="Project workflow">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1818"/>
      <stop offset="100%" stop-color="#272121"/>
    </linearGradient>
  </defs>
  <rect width="720" height="220" rx="24" fill="url(#bg3)"/>
  <text x="36" y="42" fill="#F6E9E9" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Status Workflow</text>
  <text x="36" y="62" fill="#F6E9E9" fill-opacity="0.4" font-family="Segoe UI, Arial, sans-serif" font-size="11">From intake to delivery</text>

  <!-- Nodes -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
    <rect x="36" y="100" width="100" height="44" rx="12" fill="#60A5FA" fill-opacity="0.2" stroke="#60A5FA"/>
    <text x="86" y="126" fill="#93C5FD">Running</text>

    <rect x="168" y="100" width="100" height="44" rx="12" fill="#FACC15" fill-opacity="0.2" stroke="#FACC15"/>
    <text x="218" y="126" fill="#FDE047">Pending</text>

    <rect x="300" y="100" width="120" height="44" rx="12" fill="#A78BFA" fill-opacity="0.2" stroke="#A78BFA"/>
    <text x="360" y="126" fill="#C4B5FD">Payment</text>

    <rect x="452" y="100" width="100" height="44" rx="12" fill="#34D399" fill-opacity="0.2" stroke="#34D399"/>
    <text x="502" y="126" fill="#6EE7B7">Delivered</text>

    <rect x="584" y="100" width="100" height="44" rx="12" fill="#E16428" fill-opacity="0.25" stroke="#E16428"/>
    <text x="634" y="126" fill="#F6E9E9">Receipt</text>
  </g>

  <!-- Arrows -->
  <g stroke="#E16428" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M136,122 H168" marker-end="url(#m)"/>
    <path d="M268,122 H300"/>
    <path d="M420,122 H452"/>
    <path d="M552,122 H584"/>
  </g>
  <defs>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#E16428"/>
    </marker>
  </defs>

  <text x="36" y="190" fill="#F6E9E9" fill-opacity="0.4" font-family="Segoe UI, Arial, sans-serif" font-size="11">Correction / Rejected paths branch from any active stage</text>
</svg>
